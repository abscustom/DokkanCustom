<head>

        <source src="assets/video/Stars BG.webm?v=pingpong2" type="video/webm">
    </video>
    <header class="apple-hud-wrapper" aria-label="Site navigation">
        <div class="liquid-metal-frame">
            <nav class="apple-hud-bar">
                <div class="hud-nav-group">
                    <a href="index.html" class="hud-nav-link" aria-label="Home" title="Home"><svg class="hud-nav-svg" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span>Home</span></a>
                    <a href="index.html?view=cards" class="hud-nav-link" aria-label="Cards" title="Cards"><svg class="hud-nav-svg" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="9" r="3" stroke="currentColor" stroke-width="2"/><path d="M6 20c.8-3 2.8-4.5 6-4.5s5.2 1.5 6 4.5" stroke="currentColor" stroke-width="2"/></svg><span>Cards</span></a>
                    <a href="card.html?viewer=1" class="hud-nav-link" aria-label="Viewer" title="Viewer"><svg class="hud-nav-svg" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/></svg><span>Viewer</span></a>
                    <a href="calculator.html" class="hud-nav-link" aria-label="Calculator" title="Calculator"><svg class="hud-nav-svg" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2" stroke="currentColor" stroke-width="2"/><path d="M8 8h8M8 12h2m4 0h2M8 16h2m4 0h2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Calculator</span></a>
                    <a href="editor.html" class="hud-nav-link" aria-label="Editor" title="Editor"><svg class="hud-nav-svg" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m4 16-.8 4.8L8 20l11.6-11.6a2.8 2.8 0 0 0-4-4Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="m13.8 6.2 4 4" stroke="currentColor" stroke-width="2"/></svg><span>Editor</span></a>

                </div>
            </nav>
        </div>
    </header>

    <div class="dokkan-news-snippet cards-news-snippet other-tool-news-strip" aria-label="Dokkan news"></div>

    <main class="other-tool-main support-memory-page" id="support-memory-page">
        <section class="sm-library" id="sm-library" aria-labelledby="sm-library-title">
            <header class="sm-workspace-header">
                <div class="sm-workspace-title">
                    <svg class="sm-workspace-icon" viewBox="0 0 34 34" fill="none" aria-hidden="true">
                        <rect x="4.5" y="8" width="20" height="21" rx="3" stroke="currentColor" stroke-width="1.8"/>
                        <path d="M9 14h8M9 18h9M9 22h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                        <path d="m26.5 4.5 1.25 3.05L31 8.8l-3.25 1.25-1.25 3.2-1.25-3.2L22 8.8l3.25-1.25 1.25-3.05Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                    </svg>
                    <div>
                        <h1 id="sm-library-title">Support Memory</h1>
                        <p>A collection of memories from across the journey.</p>
                    </div>
                </div>
                <div class="sm-library-controls" role="group" aria-label="Search and filter Support Memories">
                    <label class="sm-control-field" for="sm-search">
                        <span>Search Support Memories</span>
                        <input id="sm-search" class="sm-search-input" type="search" autocomplete="off" placeholder="Search memories…">
                    </label>
                    <label class="sm-control-field" for="sm-film-filter">
                        <span>Filter by film type</span>
                        <select id="sm-film-filter" class="sm-film-filter" aria-label="Filter by film type">
                            <option value="all">All film types</option>
                        </select>
                    </label>
                </div>
            </header>
            <section class="sm-memory-well" aria-label="Support Memory gallery">
                <p class="sm-library-status" id="sm-library-status" role="status" aria-live="polite">Loading the Support Memory dataset…</p>
                <div class="sm-memory-grid" id="sm-memory-grid" aria-label="Support Memories"></div>
            </section>
        </section>

    </main>

    <template id="sm-player-details-template">
        <section class="sm-player-details" aria-labelledby="sm-player-memory-name" aria-describedby="sm-player-effect">
            <div class="sm-player-memory-meta">
                <span class="sm-player-film" id="sm-player-film"></span>
                <span class="sm-player-cost" id="sm-player-cost" hidden></span>
            </div>
            <h2 id="sm-player-memory-name"></h2>
            <label class="sm-player-level-field" for="sm-player-level" hidden>
                <span>Memory level</span>
                <select id="sm-player-level"></select>
            </label>
            <section class="sm-player-detail-block">
                <h3>Effect</h3>
                <p id="sm-player-effect"></p>
            </section>
            <section class="sm-player-detail-block" id="sm-player-condition-row" hidden>
                <h3>Activation condition</h3>
                <p id="sm-player-condition"></p>
            </section>
            <section class="sm-player-detail-block" id="sm-player-duration-row" hidden>
                <h3>Duration</h3>
                <p id="sm-player-duration"></p>
            </section>
        </section>
    </template>

    <script src="js/tool-sba-nav.js?v=20260930-clean-library-nav-v3"></script>

</html>
