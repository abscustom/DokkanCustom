<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="https://i.imgur.com/7E8KqH3.png">
    <title>absCustom</title>
    <style>
        /* Glass News Popup Window */
        .news-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .news-modal.open {
            opacity: 1;
            pointer-events: auto;
        }

        .news-content {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            width: 90%;
            max-width: 650px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }

        .news-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            border-bottom: 1px solid rgba(250, 204, 21, 0.3);
            padding-bottom: 12px;
        }

        .news-header h2 {
            color: #facc15;
            margin: 0;
            font-size: 1.2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Top Nav Container */
        .top-nav {
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 520px;
            max-width: 92%;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 6px;
            border-radius: 30px;
            margin: 0 auto 15px auto;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            box-sizing: border-box;
        }

        /* Nav Item (Equal Widths) */
        .nav-item {
            flex: 1;
            position: relative;
            z-index: 2;
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 800;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 9px 0;
            border-radius: 20px;
            transition: color 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            white-space: nowrap;
        }

        .nav-item:hover,
        .nav-item.active {
            color: #facc15;
        }

        /* Smooth Sliding Yellow Pill Indicator */
        .nav-indicator {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            background: rgba(250, 204, 21, 0.15);
            border: 1.5px solid rgba(250, 204, 21, 0.6);
            box-shadow: 0 0 12px rgba(250, 204, 21, 0.3);
            border-radius: 20px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1;
            pointer-events: none;
            box-sizing: border-box;
        }

        /* 1. Sleek Filters Button (Top Left) */
        .menu-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 999;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #cbd5e1;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
        }

        .menu-btn:hover {
            color: #facc15;
            border-color: rgba(250, 204, 21, 0.5);
            background: rgba(250, 204, 21, 0.1);
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.25);
        }

        /* ------------------------------------------------------------- */
        /* --- UPDATE BOX BUTTON (TOP RIGHT GLASS PILL) --- */
        /* ------------------------------------------------------------- */
        .update-box-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 999;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #34d399;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
        }

        .update-box-btn:hover {
            color: #ffffff;
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.2);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
            transform: translateY(-1px);
        }

        .update-box-btn .spinning {
            display: inline-block;
            animation: spinIcon 1s linear infinite;
        }

        @keyframes spinIcon {
            100% { transform: rotate(360deg); }
        }

        /* ------------------------------------------------------------- */
        /* --- ADMIN MODE STYLING & DELETION BADGES --- */
        /* ------------------------------------------------------------- */
        .admin-status-badge {
            position: fixed;
            top: 65px;
            right: 20px;
            z-index: 999;
            background: rgba(239, 68, 68, 0.25);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.5px;
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
        }

        .hub-admin-mode .admin-status-badge {
            display: inline-flex !important;
        }

        .card-delete-badge {
            display: none;
        }

        .hub-admin-mode .card-delete-badge {
            display: flex !important;
            position: absolute;
            top: -6px;
            right: -6px;
            z-index: 999;
            background: #ef4444;
            color: #ffffff;
            border: 2px solid #ffffff;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.8);
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .card-delete-badge:hover {
            transform: scale(1.2) !important;
            background: #dc2626 !important;
        }

        /* 2. Matching Glass Sidebar Drawer */
        .sidebar-drawer {
            position: fixed;
            top: 0;
            left: -320px;
            width: 290px;
            height: 100vh;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-right: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 0 24px 24px 0;
            z-index: 1002;
            padding: 30px 22px;
            box-sizing: border-box;
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 8px 0 30px rgba(0, 0, 0, 0.5);
            text-align: left;
        }

        .sidebar-drawer.open {
            left: 0;
        }

        /* 3. Matching Glass Dropdowns Inside Sidebar */
        .filter-group select {
            width: 100%;
            background: rgba(30, 41, 59, 0.6);
            color: #fff;
            padding: 10px 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            backdrop-filter: blur(8px);
            transition: all 0.2s ease;
        }

        .filter-group select:focus,
        .filter-group select:hover {
            border-color: rgba(250, 204, 21, 0.6);
            box-shadow: 0 0 10px rgba(250, 204, 21, 0.25);
        }

        /* Sidebar Header & Close Button */
        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 12px;
        }

        .sidebar-header h2 {
            font-size: 1.1rem;
            color: #facc15;
            margin: 0;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        /* Round Glass Close Button (✕) */
        .close-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #cbd5e1;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border-color: rgba(250, 204, 21, 0.5);
        }

        /* Filter Card Containers */
        .filter-group {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: rgba(255, 255, 255, 0.03);
            padding: 12px 14px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .filter-group label {
            font-size: 11px;
            font-weight: 800;
            color: #facc15;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Glass Select Dropdowns */
        .filter-group select {
            width: 100%;
            background: rgba(15, 23, 42, 0.75);
            color: #f8fafc;
            padding: 9px 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
        }

        .filter-group select:focus,
        .filter-group select:hover {
            border-color: rgba(250, 204, 21, 0.5);
            box-shadow: 0 0 10px rgba(250, 204, 21, 0.2);
        }

        /* Matching Glass Reset Button */
        .reset-btn {
            width: 100%;
            margin-top: 10px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            padding: 10px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
            margin-bottom: 20px;
        }

        .reset-btn:hover {
            background: rgba(239, 68, 68, 0.3);
            color: #fff;
            border-color: #ef4444;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
        }

        /* Grid adjusts to take remaining space */
        .grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 0px;
            max-width: 95%;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.122);
            padding: 30px;
            border-radius: 16px;
        }

        body {
            background: transparent;
            color: #000000;
            font-family: sans-serif;
            text-align: center;
            padding: 15px 20px;
            min-height: 100vh;
            margin: 0;
        }

        /* Fixes video to cover the entire screen behind content */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -2;
        }

        /* The Frosted Glass Layer */
        .glass-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(0px);
            -webkit-backdrop-filter: blur(0px);
        }

        .hub-header {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            max-width: 1400px;
            margin: 0 auto 5px auto;
            min-height: 60px;
        }

        h1 {
            font-size: 3rem;
            color: #facc15;
            text-shadow: 0 0 15px rgba(250, 204, 21, 0.4);
            margin: 0;
            text-transform: uppercase;
            font-weight: 900;
        }

        /* --- LOGO STYLES --- */
        .custom-logo {
            max-height: 220px;
            width: auto;
            cursor: default;
            margin: -10px 0;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.5));
        }

        .custom-logo:hover {
            animation: bounceLogo 0.5s cubic-bezier(0.28, 0.84, 0.42, 1) infinite alternate;
        }

        @keyframes bounceLogo {
            0% {
                transform: translateY(0) scale(1);
            }

            100% {
                transform: translateY(-12px) scale(1.05);
            }
        }

        .editor-btn {
            position: absolute;
            right: 20px;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            color: #ffffff;
            text-decoration: none;
            padding: 10px 22px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-weight: 800;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .editor-btn:hover {
            background: linear-gradient(135deg, #3b82f6 0%, #60a5fa 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .editor-btn:active {
            transform: translateY(1px);
        }

        .controls {
            margin-bottom: 30px;
        }

        select {
            background: #1e293b;
            color: #fff;
            padding: 10px 20px;
            border: 2px solid #3b82f6;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
        }

        select:focus {
            border-color: #facc15;
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.5);
        }

        .char-box {
            --scale: .8;
            text-decoration: none;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: scale(var(--scale));
            transform-origin: center center;
            transition: transform 0.2s ease;
            position: relative;
        }

        .char-box:hover {
            transform: scale(calc(var(--scale) * 1.05));
            z-index: 10;
        }

        .card-icon {
            position: relative;
            width: 150px;
            height: 150px;
            margin-bottom: 4px;
        }

        .card-icon img,
        .card-icon video {
            position: absolute;
            pointer-events: none;
        }

        .frame {
            width: 150px;
            height: 150px;
            z-index: 1;
            top: 0;
            left: 0;
        }

        .char-img {
            height: 188px;
            z-index: 2;
            bottom: -13px;
            left: 50%;
            transform: translateX(-50%);
        }

        .lr-dial {
            width: 140px;
            height: 140px;
            z-index: 1;
            top: 5px;
            left: 5px;
            animation: spin 6s linear infinite;
        }

        .lr-lightning {
            z-index: 2;
            width: 290px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            filter: brightness(10) contrast(1.2);
            mix-blend-mode: screen;
        }

        .rarity {
            height: 75px;
            z-index: 3;
            bottom: -16px;
            left: -10px;
            filter: drop-shadow(0 2px 2px #000);
        }

        .type {
            height: 55px;
            z-index: 3;
            top: -8px;
            right: -8px;
        }

        .name-container {
            width: 150px;
            height: 32px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #555;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .char-name {
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            line-height: 1;
            color: #f8fafc;
        }

        .char-name.scrolling {
            display: flex;
            align-items: center;
            width: max-content;
            animation: scroll-text 10s linear infinite;
        }

        @keyframes scroll-text {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-50%);
            }
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <video autoplay muted loop playsinline id="bg-video">
        <source src="webbg3.mp4" type="video/mp4">
    </video>
    <div class="glass-overlay"></div>

    <div class="hub-header">
        <img src="./abs.custom.png" onerror="this.src='https://i.imgur.com/MM4mZEu.png';" alt="Custom Cards"
            class="custom-logo" />
    </div>

    <!-- ADMIN STATUS BADGE -->
    <div class="admin-status-badge">
        🔓 Admin Mode Active (Click ✕ on cards to delete)
    </div>

    <!-- TOP NAVIGATION BAR -->
    <nav class="top-nav" id="topNav">
        <div class="nav-indicator" id="navIndicator"></div>
        <a href="#" class="nav-item active">🏠 Home</a>
        <a href="https://x.com/dokkan_global" target="_blank" class="nav-item">📰 News</a>
        <a href="https://abscustom.github.io/DokkanCustom/CardEditor/" target="_blank" class="nav-item">📝Editor</a>
    </nav>

    <!-- 1. TOP-LEFT FILTERS BUTTON -->
    <button class="menu-btn" onclick="toggleSidebar()">
        <span>☰</span> Filters
    </button>

    <!-- 2. TOP-RIGHT UPDATE BOX BUTTON -->
    <button class="update-box-btn" onclick="updateCharacterBox()">
        <span id="update-box-icon">📦</span> Update Box
    </button>

    <!-- 3. Dark Overlay when open -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- 4. Slide-out Panel -->
    <aside class="sidebar-drawer" id="sidebarDrawer">
        <div class="sidebar-header">
            <h2>Filters</h2>
            <button class="close-btn" onclick="toggleSidebar()">✕</button>
        </div>

        <!-- RESET FILTERS BUTTON -->
        <button class="reset-btn" onclick="resetFilters()">
            🔄 Reset Filters
        </button>

        <!-- TYPE FILTER -->
        <div class="filter-group">
            <label>Character Type</label>
            <select id="typeFilter" onchange="filterCards()">
                <option value="all">Show All Types</option>
                <option value="agl">AGL</option>
                <option value="teq">TEQ</option>
                <option value="int">INT</option>
                <option value="str">STR</option>
                <option value="phy">PHY</option>
            </select>
        </div>

        <!-- RARITY FILTER -->
        <div class="filter-group">
            <label>Card Rarity</label>
            <select id="rarityFilter" onchange="filterCards()">
                <option value="all">Show All Rarities</option>
                <option value="lr">LR</option>
                <option value="tur">TUR</option>
            </select>
        </div>

        <!-- FORM FILTER -->
        <div class="filter-group">
            <label>Character Form</label>
            <select id="formFilter" onchange="filterCards()">
                <option value="all">Show All Forms</option>
                <option value="a">Main Form (A)</option>
                <option value="b">Form (B)</option>
                <option value="c">Form (C)</option>
            </select>
        </div>
    </aside>

    <div class="grid" id="cardGrid"></div>

    <script>
        // Filtering Logic
        function toggleSidebar() {
            document.getElementById('sidebarDrawer').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('open');
        }

        // Combined Filter Function
        function filterCards() {
            const selectedType = document.getElementById('typeFilter').value;
            const selectedForm = document.getElementById('formFilter').value;
            const selectedRarity = document.getElementById('rarityFilter').value;
            const cards = document.querySelectorAll('.char-box');
            cards.forEach(card => {
                const cardForm = card.getAttribute('data-tag') || 'a';
                const typeImg = card.querySelector('img.type');
                let cardType = 'unknown';
                if (typeImg && typeImg.src) {
                    const src = typeImg.src.toLowerCase();
                    if (src.includes('agl')) cardType = 'agl';
                    else if (src.includes('teq')) cardType = 'teq';
                    else if (src.includes('int')) cardType = 'int';
                    else if (src.includes('str')) cardType = 'str';
                    else if (src.includes('phy')) cardType = 'phy';
                }

                const rarityImg = card.querySelector('img.rarity');
                let cardRarity = 'unknown';
                if (rarityImg && rarityImg.src) {
                    const src = rarityImg.src.toLowerCase();
                    if (src.includes('lr')) cardRarity = 'lr';
                    else if (src.includes('tur')) cardRarity = 'tur';
                }

                const matchesType = (selectedType === 'all' || cardType === selectedType);
                const matchesForm = (selectedForm === 'all' || cardForm === selectedForm);
                const matchesRarity = (selectedRarity === 'all' || cardRarity === selectedRarity);

                if (matchesType && matchesForm && matchesRarity) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // Sliding Yellow Nav Indicator Logic
        const topNav = document.getElementById('topNav');
        const navIndicator = document.getElementById('navIndicator');
        const navItems = document.querySelectorAll('.nav-item');
        const activeNavItem = document.querySelector('.nav-item.active');

        function moveNavIndicator(element) {
            if (!element || !navIndicator) return;
            navIndicator.style.left = `${element.offsetLeft}px`;
            navIndicator.style.top = `${element.offsetTop}px`;
            navIndicator.style.width = `${element.offsetWidth}px`;
            navIndicator.style.height = `${element.offsetHeight}px`;
        }

        moveNavIndicator(activeNavItem);

        navItems.forEach(item => {
            item.addEventListener('mouseenter', () => moveNavIndicator(item));
        });

        topNav.addEventListener('mouseleave', () => moveNavIndicator(activeNavItem));
        window.addEventListener('resize', () => moveNavIndicator(activeNavItem));

        function resetFilters() {
            document.getElementById('typeFilter').value = 'all';
            document.getElementById('formFilter').value = 'all';
            document.getElementById('rarityFilter').value = 'all';
            filterCards();
        }

        // Auto-scroll long names seamlessly
        function initNameScrolling() {
            document.querySelectorAll('.char-name').forEach(el => {
                if (el.scrollWidth > el.parentElement.clientWidth && !el.classList.contains('scrolling')) {
                    const text = el.innerText;
                    el.innerHTML =
                        `<span>${text}&nbsp;&nbsp;&nbsp;&nbsp;</span><span>${text}&nbsp;&nbsp;&nbsp;&nbsp;</span>`;
                    el.classList.add('scrolling');
                }
            });
        }

        // Slow down background video
        const bgVideo = document.getElementById('bg-video');
        if (bgVideo) bgVideo.playbackRate = 0.5;

        // -------------------------------------------------------------
        // --- ADMIN MODE & CARD DELETION ENGINE (Spiderman Password + Retries)
        // -------------------------------------------------------------
        window.toggleHubAdminMode = function() {
            if (document.body.classList.contains('hub-admin-mode')) {
                document.body.classList.remove('hub-admin-mode');
                window.hubAdminToken = null;
                alert("🔒 Admin Mode Deactivated.");
                return;
            }

            const pass = prompt("🔒 Enter Admin Password:");
            if (pass !== "spiderman") {
                alert("❌ Incorrect password!");
                return;
            }

            document.body.classList.add('hub-admin-mode');
            attachDeleteBadges();

            alert("🔓 Admin Mode Activated!\n\nClick the red ✕ button on any card to permanently delete it from GitHub.");
        };

        // Keyboard Shortcut: Ctrl + Shift + A ONLY to toggle Admin Mode
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'A' || e.key === 'a')) {
                e.preventDefault();
                window.toggleHubAdminMode();
            }
        });

        // Attach red ✕ badges to all cards for deletion
        function attachDeleteBadges() {
            document.querySelectorAll('#cardGrid .char-box').forEach(card => {
                if (!card.querySelector('.card-delete-badge')) {
                    const href = card.getAttribute('href') || '';
                    const match = href.match(/abscustom\.github\.io\/([^\/]+)/);
                    const folderName = match ? match[1] : '';
                    const charName = card.querySelector('.char-name')?.textContent || 'Card';

                    const badge = document.createElement('div');
                    badge.className = 'card-delete-badge';
                    badge.innerHTML = '✕';
                    badge.title = 'Delete card from GitHub';
                    badge.onclick = (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        confirmDeleteCard(card, folderName, charName);
                    };
                    card.appendChild(badge);
                }
            });
        }

        // Confirm and delete card folder from GitHub repository (Handles delays to prevent 409 errors)
        async function confirmDeleteCard(cardElement, folderName, charName) {
            if (!folderName) {
                alert("Could not detect GitHub folder for this card.");
                return;
            }

            let token = window.hubAdminToken;
            if (!token) {
                token = prompt(`🗑️ Enter GitHub Personal Access Token to DELETE '${charName}' (${folderName}):`);
                if (!token || !token.trim()) {
                    alert("Deletion cancelled (GitHub token required).");
                    return;
                }
                token = token.trim();
                window.hubAdminToken = token; // Store in session so user doesn't type it 20 times!
            }

            const confirmed = confirm(`⚠️ Are you sure you want to PERMANENTLY DELETE '${charName}' (${folderName}) from GitHub?`);
            if (!confirmed) return;

            const badge = cardElement.querySelector('.card-delete-badge');
            if (badge) badge.innerText = '⏳';

            try {
                // Delete files in folder from GitHub (Robust Method)
                await purgeCardFromGitHub(folderName, token);

                // Remove from DOM
                cardElement.remove();

                // Save updated grid
                const grid = document.getElementById('cardGrid');
                localStorage.setItem('hub_cached_cards_html', grid.innerHTML);

                alert(`✅ '${charName}' deleted successfully!`);
            } catch (err) {
                console.error("Delete Error:", err);
                alert("Failed to delete card from GitHub: " + err.message);
                if (badge) badge.innerText = '✕';
            }
        }

        // Robust GitHub API Folder Purge (Catches individual file errors & retries)
        async function purgeCardFromGitHub(folderName, token) {
            const getRes = await fetch(`https://api.github.com/repos/abscustom/abscustom.github.io/contents/${folderName}?t=${Date.now()}`, {
                headers: { 'Authorization': `token ${token}` }
            });

            if (!getRes.ok) throw new Error("Could not access folder on GitHub. Check token permissions.");
            const items = await getRes.json();

            let filesToDelete = [];
            
            // Map out all files in main folder and sub-folders (like /images/)
            for (const item of items) {
                if (item.type === 'file') {
                    filesToDelete.push(item);
                } else if (item.type === 'dir') {
                    const subRes = await fetch(`https://api.github.com/repos/abscustom/abscustom.github.io/contents/${item.path}?t=${Date.now()}`, {
                        headers: { 'Authorization': `token ${token}` }
                    });
                    if (subRes.ok) {
                        const subItems = await subRes.json();
                        for (const subItem of subItems) {
                            if (subItem.type === 'file') {
                                filesToDelete.push(subItem);
                            }
                        }
                    }
                }
            }

            // Delete files sequentially with a small delay to prevent 409 Conflict Errors
            let failed = 0;
            for (const file of filesToDelete) {
                try {
                    const delRes = await fetch(`https://api.github.com/repos/abscustom/abscustom.github.io/contents/${file.path}`, {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `token ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: `Purge card asset: ${file.path}`,
                            sha: file.sha
                        })
                    });

                    if (!delRes.ok) {
                        // If GitHub returns 409 Conflict, fetch fresh SHA and try one more time
                        if(delRes.status === 409) {
                            const retryGet = await fetch(`https://api.github.com/repos/abscustom/abscustom.github.io/contents/${file.path}?t=${Date.now()}`, { headers: { 'Authorization': `token ${token}` } });
                            if(retryGet.ok) {
                                const freshFile = await retryGet.json();
                                await fetch(`https://api.github.com/repos/abscustom/abscustom.github.io/contents/${file.path}`, {
                                    method: 'DELETE',
                                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ message: `Purge card asset: ${file.path}`, sha: freshFile.sha })
                                });
                            }
                        } else if (delRes.status !== 404) {
                            failed++;
                        }
                    }
                    // Crucial 300ms pause to stop GitHub Abuse detection flagging us
                    await new Promise(r => setTimeout(r, 300));
                } catch(e) {
                    failed++;
                }
            }

            if (failed === filesToDelete.length && filesToDelete.length > 0) {
                throw new Error("Failed to delete the files. Ensure your token has 'repo' scope.");
            }
        }

        // -------------------------------------------------------------
        // --- LIVE UPDATE CHARACTER BOX FROM GITHUB ---
        // -------------------------------------------------------------
        async function updateCharacterBox() {
            const btn = document.querySelector('.update-box-btn');
            const originalText = btn.innerHTML;

            try {
                btn.innerHTML = `<span class="spinning">🔄</span> Scanning...`;
                btn.style.pointerEvents = 'none';

                const repoRes = await fetch('https://api.github.com/repos/abscustom/abscustom.github.io/contents/');
                if (!repoRes.ok) throw new Error("GitHub API limit or network issue.");
                const contents = await repoRes.json();

                const ignored = ['DokkanCustom', 'CardEditor', 'images', 'css', 'js', 'assets', '.github'];
                const cardFolders = contents.filter(item => 
                    item.type === 'dir' && !ignored.includes(item.name) && !item.name.startsWith('.')
                );

                if (cardFolders.length === 0) {
                    alert("No character card folders found on GitHub!");
                    btn.innerHTML = originalText;
                    btn.style.pointerEvents = 'auto';
                    return;
                }

                btn.innerHTML = `<span class="spinning">🔄</span> Syncing ${cardFolders.length} Cards...`;

                const cardHtmlArray = [];

                for (const folder of cardFolders) {
                    try {
                        const folderName = folder.name;
                        const cardUrl = `https://abscustom.github.io/${folderName}/`;
                        
                        const indexRes = await fetch(`${cardUrl}index.html?nocache=${Date.now()}`);
                        if (!indexRes.ok) continue;

                        const htmlText = await indexRes.text();
                        const doc = new DOMParser().parseFromString(htmlText, 'text/html');

                        const tag = doc.querySelector('meta[name="hub-id"]')?.getAttribute('content') || 'a';
                        
                        let charName = doc.querySelector('#char-name')?.textContent?.trim() || '';
                        if (!charName) {
                            const rawTitle = doc.querySelector('title')?.textContent || folderName;
                            charName = rawTitle.replace(/^\[.*?\]\s*/, '').trim();
                        }

                        const fixUrl = (src, fallback) => {
                            if (!src) return fallback;
                            if (src.startsWith('http')) return src;
                            const clean = src.replace(/^\.\//, '');
                            return `${cardUrl}${clean}`;
                        };

                        const raritySrc = fixUrl(doc.querySelector('#main-rarity-icon')?.getAttribute('src'), `${cardUrl}images/rarity_LR.png`);
                        const isLR = raritySrc.toLowerCase().includes('lr');

                        const iconEl = doc.querySelector(isLR ? '#img-lr' : '#img-tur')
                                    || doc.querySelector('#db-thumb-img')
                                    || doc.querySelector('#img-tur')
                                    || doc.querySelector('#img-ssr')
                                    || doc.querySelector('.thumb-img')
                                    || doc.querySelector('.card-info-thumb img:not(.lr-spin-dial)')
                                    || doc.querySelector('#myOverlayImage');

                        const charImgSrc = fixUrl(iconEl?.getAttribute('src'), `${cardUrl}images/SSR_Icon.png`);
                        const frameSrc = fixUrl(doc.querySelector('.card-frame')?.getAttribute('src'), `${cardUrl}images/frame_agl.png`);
                        const typeSrc = fixUrl(doc.querySelector('.typing-icon')?.getAttribute('src'), `${cardUrl}images/super_type_agl.png`);

                        let lrOverlayHtml = '';
                        if (isLR) {
                            lrOverlayHtml = `
                <img class="lr-dial" src="${cardUrl}images/lr_spin_dial.png" onerror="this.remove()">
                <video class="lr-lightning" autoplay muted loop playsinline>
                    <source src="${cardUrl}images/lightningfx.webm" type="video/webm">
                </video>`;
                        }

                        const cardHtml = `
        <a href="${cardUrl}" target="_blank" class="char-box" data-tag="${tag}">
            <div class="card-icon">
                <img class="frame" src="${frameSrc}">
                ${lrOverlayHtml}
                <img class="char-img" src="${charImgSrc}">
                <img class="rarity" src="${raritySrc}">
                <img class="type" src="${typeSrc}">
            </div>
            <div class="name-container">
                <div class="char-name">${charName}</div>
            </div>
        </a>`;

                        cardHtmlArray.push(cardHtml);
                    } catch (err) {
                        console.warn(`Could not sync card ${folder.name}:`, err);
                    }
                }

                if (cardHtmlArray.length > 0) {
                    const grid = document.getElementById('cardGrid');
                    grid.innerHTML = cardHtmlArray.join('\n');
                    
                    localStorage.setItem('hub_cached_cards_html', grid.innerHTML);
                    
                    if (document.body.classList.contains('hub-admin-mode')) attachDeleteBadges();
                    filterCards();
                    initNameScrolling();
                    
                    alert(`✅ Box Updated Successfully! Synced ${cardHtmlArray.length} character cards from GitHub.`);
                }

            } catch (error) {
                console.error("Update Box Error:", error);
                alert("Could not update box from GitHub: " + error.message);
            } finally {
                btn.innerHTML = originalText;
                btn.style.pointerEvents = 'auto';
            }
        }

        // Restore cached box on startup
        window.addEventListener('DOMContentLoaded', () => {
            const cachedBox = localStorage.getItem('hub_cached_cards_html');
            if (cachedBox) {
                document.getElementById('cardGrid').innerHTML = cachedBox;
            }
            if (document.body.classList.contains('hub-admin-mode')) attachDeleteBadges();
            filterCards();
            initNameScrolling();
        });
    </script>
