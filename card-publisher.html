<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Publish custom card</title>
<style>body{font:17px system-ui,sans-serif;background:#0e1117;color:#eee;max-width:580px;margin:60px auto;padding:24px}h1{font-size:28px}p{line-height:1.6}button,a{font:inherit}button{padding:12px 20px;border:0;border-radius:8px;background:#8bd6ac;color:#10271b;cursor:pointer}button:disabled{opacity:.45;cursor:default}a{color:#9ac8ff}#status{min-height:3em}dl{display:grid;grid-template-columns:120px 1fr;gap:12px}dd{margin:0;overflow-wrap:anywhere}</style></head>
<body><h1>Publish custom card</h1><p id="status" role="status">Waiting for the editor…</p><dl><dt>Card</dt><dd id="name">—</dd><dt>Card ID</dt><dd id="card-id">—</dd><dt>Revision</dt><dd id="revision">—</dd></dl><p>The save updates the shared card and preserves its direct form links.</p><p><a id="sign-in" target="_blank" rel="noopener">Sign in to Manager</a></p><button id="save" disabled>Save card</button><button id="retry" type="button">Check sign-in</button><script src="js/card-content-publisher.js"></script></body></html>
